services:
  # ── Backend: FastAPI + SQLite ──────────────────────────────────────────
  - type: web
    name: mplads-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash backend/start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FRONTEND_URL
        value: "https://mplads-dashboard.onrender.com"
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
    healthCheckPath: /

  # ── Frontend: React static site ────────────────────────────────────────
  - type: web
    name: mplads-dashboard
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://mplads-api.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
